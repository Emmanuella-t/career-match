[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-match"
version = "0.1.0"
description = "Explainable ML-powered resume-to-job matching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emmanuella Turkson" }]
keywords = ["resume", "job-matching", "machine-learning", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0,<4",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "supabase>=2.4,<3",
    "PyJWT[crypto]>=2.8,<3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "sentence-transformers>=3.0,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27",
    "supabase>=2.4,<3",
    "PyJWT[crypto]>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/Emmanuella-t/career-match"
Repository = "https://github.com/Emmanuella-t/career-match"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "semantic: loads sentence-transformers/all-MiniLM-L6-v2 (cached after first download)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["legacy", "frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
